[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-agent-harness"
version = "1.0.0"
description = "A runnable demo of deterministic controls around a banking AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.60",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
banking-agent-harness = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
